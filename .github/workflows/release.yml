name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: ./tools/build.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sernate_firehol_blocklist_check.tar.gz
            dist/sernate_firehol_blocklist_check.tar.gz.sha256
            dist/version.txt
